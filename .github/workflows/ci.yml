name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexxus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexxus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexxus_test
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: postgres
      DATABASE_URL_MIGRATOR: postgres://migrator:ci_migrator@localhost:5432/nexxus_test
      DATABASE_URL_AUTH: postgres://auth_service:ci_auth@localhost:5432/nexxus_test
      DATABASE_URL_APP: postgres://app_user:ci_app@localhost:5432/nexxus_test
      BETTER_AUTH_SECRET: ci_secret_with_at_least_32_characters
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:8081
      JWT_ISSUER: nexxus
      JWT_AUDIENCE: nexxus-app
      JWT_KID: v1
      JWT_PRIVATE_KEY_B64: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1DNENBUUF3QlFZREsyVndCQ0lFSUo1MnVHVEFueHEvTG14cWZab3JYQ3huaXV5Rk5ZMjEzT01CTFc1a1RUVmEKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=
      JWT_PUBLIC_KEY_B64: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUNvd0JRWURLMlZ3QXlFQVpPQW1tbXo2aE5YV01lSXNhYzBqK2pJTlRqKy91SU83M0pxYTBlRzcwZ1E9Ci0tLS0tRU5EIFBVQkxJQyBLRVktLS0tLQo=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C database db:bootstrap
      - run: pnpm -C database db:migrate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm -C backend verify
